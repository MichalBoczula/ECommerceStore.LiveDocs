name: LiveDocs CI and delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image to the configured Azure environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: livedocs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Check manifests and preserve released versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA=$(git rev-parse HEAD^); fi
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA:manifests/portal.json" 2>/dev/null; then
            git show "$BASE_SHA:manifests/portal.json" > "$RUNNER_TEMP/previous-portal.json"
            python3 scripts/assemble.py --previous "$RUNNER_TEMP/previous-portal.json"
          else
            python3 scripts/assemble.py
          fi
      - name: Check assembly, deployment and smoke regressions
        run: python3 -m unittest discover -s tests -v
      - name: Check Bash and Compose
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          docker compose config --quiet

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [foundation, app]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Validate pinned provider schema and mock plans without Azure
        env:
          DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          terraform -chdir="infra/$DIRECTORY" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="infra/$DIRECTORY" validate
          terraform -chdir="infra/$DIRECTORY" test

  documentation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Create isolated fixture archives and manifests
        run: python3 tests/bundle_fixtures.py build-input/fixtures
      - uses: docker/setup-buildx-action@v3
      - name: Build actual Allure fixture image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ecommerce-store-livedocs:fixtures
          build-args: |
            VCS_REF=${{ github.sha }}
            MANIFEST_DIRECTORY=build-input/fixtures/manifests
            ARTIFACT_DIRECTORY=build-input/fixtures/cache
      - name: Check generated reports and version isolation
        run: |
          set -euo pipefail
          container=$(docker create ecommerce-store-livedocs:fixtures)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p artifacts
          docker cp "$container:/usr/share/nginx/html" artifacts/fixture-site
          python3 scripts/check-fixture-site.py artifacts/fixture-site
      - name: Check nested report routes and assets over real HTTP
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/smoke-container.sh ecommerce-store-livedocs:fixtures "$EXPECTED_SHA"

  container:
    needs: [validate, infrastructure, documentation-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARCHIVE_STORAGE_ACCOUNT: ${{ vars.AZURE_ARCHIVE_STORAGE_ACCOUNT }}
      AZURE_ARCHIVE_CONTAINER: ${{ vars.AZURE_ARCHIVE_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Select trusted production or isolated PR inputs
        id: inputs
        run: python3 scripts/select-build-input.py
      - name: Validate private archive configuration
        if: steps.inputs.outputs.archive_auth == 'true'
        run: python3 scripts/validate-azure-config.py archive
      - name: Sign in to read private archives on main
        if: steps.inputs.outputs.archive_auth == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch and verify private archived inputs
        if: steps.inputs.outputs.archive_auth == 'true'
        run: python3 scripts/fetch-archives.py --azure-auth
      - uses: docker/setup-buildx-action@v3
      - name: Set build timestamp
        id: metadata
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ecommerce-store-livedocs:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            MANIFEST_DIRECTORY=${{ steps.inputs.outputs.manifest_directory }}
            ARTIFACT_DIRECTORY=${{ steps.inputs.outputs.artifact_directory }}
      - name: Smoke-test the actual container
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/smoke-container.sh ecommerce-store-livedocs:ci "$EXPECTED_SHA"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-livedocs:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested and scanned image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-livedocs
          scanned_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-livedocs:ci)"
          for tag in "$GITHUB_SHA" latest; do
            docker tag ecommerce-store-livedocs:ci "$repository:$tag"
            test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$repository:$tag")"
            docker push "$repository:$tag" | tee "$RUNNER_TEMP/push-$tag.log"
          done
          digest="$(awk '/digest: sha256:/ {print $3}' "$RUNNER_TEMP/push-$GITHUB_SHA.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ {print $3}' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$digest" = "$latest_digest"
          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"
          echo "Published tested image: \`$repository@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-azure:
    needs: container
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (vars.AZURE_DEPLOY_ENABLED == 'true' || inputs.deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: livedocs-azure-delivery
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_APP_DEPLOYMENT_READY: ${{ vars.AZURE_APP_DEPLOYMENT_READY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Validate Azure configuration
        run: python3 scripts/validate-azure-config.py deploy
      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image and check public endpoint
        env:
          IMAGE: ${{ needs.container.outputs.image }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/deploy-azure.sh "$IMAGE" "$EXPECTED_SHA"
