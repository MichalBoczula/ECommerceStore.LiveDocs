name: LiveDocs image CI and publication

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livedocs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Check manifests and preserve released versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA=$(git rev-parse HEAD^); fi
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA:manifests/portal.json" 2>/dev/null; then
            git show "$BASE_SHA:manifests/portal.json" > "$RUNNER_TEMP/previous-portal.json"
            python3 scripts/assemble.py --previous "$RUNNER_TEMP/previous-portal.json"
          else
            python3 scripts/assemble.py
          fi
      - name: Check assembly and smoke regressions
        run: python3 -m unittest discover -s tests -v
      - name: Check Bash and Compose
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          docker compose config --quiet

  documentation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Create isolated fixture archives and manifests
        run: python3 tests/bundle_fixtures.py build-input/fixtures
      - uses: docker/setup-buildx-action@v3
      - name: Build actual Allure fixture image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ecommerce-store-livedocs:fixtures
          build-args: |
            VCS_REF=${{ github.sha }}
            MANIFEST_DIRECTORY=build-input/fixtures/manifests
            ARTIFACT_DIRECTORY=build-input/fixtures/cache
      - name: Check generated reports and version isolation
        run: |
          set -euo pipefail
          container=$(docker create ecommerce-store-livedocs:fixtures)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p artifacts
          docker cp "$container:/usr/share/nginx/html" artifacts/fixture-site
          python3 scripts/check-fixture-site.py artifacts/fixture-site
      - name: Check nested report routes and assets over real HTTP
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/smoke-container.sh ecommerce-store-livedocs:fixtures "$EXPECTED_SHA"

  container:
    needs: [validate, documentation-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set build timestamp
        id: metadata
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ecommerce-store-livedocs:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
      - name: Smoke-test the actual container
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/smoke-container.sh ecommerce-store-livedocs:ci "$EXPECTED_SHA"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-livedocs:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested and scanned image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-livedocs
          scanned_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-livedocs:ci)"
          for tag in "$GITHUB_SHA" latest; do
            docker tag ecommerce-store-livedocs:ci "$repository:$tag"
            test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$repository:$tag")"
            docker push "$repository:$tag" | tee "$RUNNER_TEMP/push-$tag.log"
          done
          digest="$(awk '/digest: sha256:/ {print $3}' "$RUNNER_TEMP/push-$GITHUB_SHA.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ {print $3}' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$digest" = "$latest_digest"
          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"
          echo "Published tested image: \`$repository@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Write published image metadata for Infrastructure
        if: steps.publish.outputs.image != ''
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path("artifacts").mkdir(exist_ok=True)
          metadata = {"schemaVersion": 1, "image": os.environ["PUBLISHED_IMAGE"],
                      "commitSha": os.environ["GITHUB_SHA"], "builtAt": os.environ["BUILD_DATE"]}
          Path("artifacts/image.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PYTHON
      - name: Upload published image metadata
        if: steps.publish.outputs.image != ''
        uses: actions/upload-artifact@v4
        with:
          name: livedocs-image
          path: artifacts/image.json
          if-no-files-found: error
