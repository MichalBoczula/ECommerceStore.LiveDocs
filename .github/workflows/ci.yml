name: CI

on:
  push:
    branches: [main, 'version*', 'v[0-9]*']
  pull_request:
    branches: [main, 'version*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-ci.txt
      - name: Verify manifests and preserve released versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci.sh source
      - name: Check Python, Bash and Compose
        run: bash scripts/ci.sh build

  archive-inputs:
    environment: ${{ github.event_name == 'pull_request' && 'livedocs-archive-pr' || 'livedocs-archive-build' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      required: ${{ steps.inputs.outputs.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - name: Inspect selected archive references
        id: inputs
        run: python3 scripts/check-archive-inputs.py
      - name: Require trusted archive access
        if: steps.inputs.outputs.required == 'true'
        env:
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CLIENT_ID: ${{ vars.LIVEDOCS_AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACCOUNT: ${{ vars.LIVEDOCS_STORAGE_ACCOUNT }}
        run: |
          test "$TRUSTED" = true || { echo 'Fork PRs cannot read private documentation archives.' >&2; exit 1; }
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID ACCOUNT; do
            test -n "${!name}" || { echo "Missing archive variable: $name" >&2; exit 1; }
          done
      - name: Authenticate archive reader with OIDC
        if: steps.inputs.outputs.required == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.LIVEDOCS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch private inputs outside Docker
        if: steps.inputs.outputs.required == 'true'
        env:
          ACCOUNT: ${{ vars.LIVEDOCS_STORAGE_ACCOUNT }}
        run: python3 scripts/fetch-archives.py --azure-auth --account "$ACCOUNT" --container livedocs
      - uses: actions/upload-artifact@v4
        if: steps.inputs.outputs.required == 'true'
        with:
          name: verified-archive-inputs
          path: build-input/cache/*.zip
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-ci.txt
      - name: Audit direct and transitive Python dependencies
        run: bash scripts/ci.sh audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: artifacts/verification/dependency-audit.json
          if-no-files-found: warn

  assembly-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-ci.txt
      - name: Verify assembly suite and generator coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test assembly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assembly-test-results
          path: artifacts/verification/assembly/
          if-no-files-found: warn

  hosting-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-ci.txt
      - name: Verify hosting and delivery regressions
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test hosting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-test-results
          path: artifacts/verification/hosting/
          if-no-files-found: warn

  documentation-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - uses: docker/setup-buildx-action@v3
      - name: Verify actual Allure generation and fixture HTTP behavior
        env:
          VCS_REF: ${{ github.sha }}
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test documentation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-test-results
          path: artifacts/verification/documentation/
          if-no-files-found: warn

  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, archive-inputs, assembly-tests, hosting-tests, documentation-tests, dependency-audit, secret-scan, dependency-review]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require every mandatory job
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-quality-gate.py

  docker-image:
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    needs: [quality-gate, archive-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      VCS_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set build timestamp
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: needs.archive-inputs.outputs.required == 'true'
        with:
          name: verified-archive-inputs
          path: build-input/cache
      - name: Build image once
        run: bash scripts/ci.sh image
      - name: Smoke-test the actual production container
        run: bash scripts/ci.sh smoke ecommerce-store-livedocs:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-livedocs:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record scanned image identity
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-livedocs:ci)"
          test -n "$image_id"
          echo "Scanned image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested and scanned image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/ci.sh publish
      - uses: actions/upload-artifact@v4
        if: steps.publish.outputs.image != ''
        with:
          name: livedocs-image
          path: artifacts/verification/image.json
          if-no-files-found: error
