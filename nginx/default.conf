server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Snapshots share stable URLs until LD/2 adds immutable versioned assets.
    add_header Cache-Control "no-cache" always;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = /health/ready {
        access_log off;
        # Check a baked-in file rather than declaring a missing site ready.
        try_files /ready.json =503;
    }

    location = /ready.json { return 404; }
    location = / { return 302 /livedoc/; }
    location = /livedoc { return 301 /livedoc/; }
    location = /build-info.json { try_files $uri =404; }
    location /livedoc/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
